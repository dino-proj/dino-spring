name: Publish package to the Maven Central Repository

# Run workflow on commits to the `main` branch
on:
  push:
    tags:
      - 'RELEASE-*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'info'
        type: choice
        options:
          - error
          - warning
          - info
          - debug
      autoPublish:
        description: 'Auto publish'
        required: true
        default: true
        type: boolean
      waitUntil:
        description: 'Wait until'
        required: true
        type: choice
        options:
          - published
          - uploaded
          - validated
      dino_dependencies_root:
        description: 'Skip dependencies?'
        required: false
        type: boolean
      dino_spring_assembly:
        description: 'Skip assembly?'
        required: false
        type: boolean
      dino_spring_boot_starter_parent:
        description: 'Skip boot?'
        required: false
        type: boolean
      dino_spring_cloud_starter_parent:
        description: 'Skip cloud?'
        required: false
        type: boolean
      dino_spring_commons:
        description: 'Skip commons?'
        required: false
        type: boolean
      dino_spring_data:
        description: 'Skip data?'
        required: false
        type: boolean
      dino_spring_auth:
        description: 'Skip auth?'
        required: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      MVN_OPT: '--errors --no-transfer-progress --batch-mode'
      BUILD_OPT: '-Dmaven.test.skip=true -P publish'
      CENTRAL_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      AUTO_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.autoPublish }}
      WAIT_UNTIL: ${{ inputs.waitUntil }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Validate publishing configuration
        run: |
          if [[ -z "$CENTRAL_USERNAME" || -z "$CENTRAL_PASSWORD" ]]; then
            echo "::error::NEXUS_USERNAME and NEXUS_PASSWORD must contain a Central Portal user token."
            exit 1
          fi
          if [[ "$AUTO_PUBLISH" = false && "$WAIT_UNTIL" = published ]]; then
            echo "::error::waitUntil=published requires autoPublish=true. Select uploaded or validated for manual publishing."
            exit 1
          fi

      - name: Install Java and Maven
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
          cache: 'maven'

      - name: Package & Install to Local Repository
        run: |
          # 定义项目数组
          projects=(
            "dino-dependencies-root"
            "dino-spring-assembly"
            "dino-spring-boot-starter-parent"
            "dino-spring-cloud-starter-parent"
            "dino-spring-commons"
            "dino-spring-data"
            "dino-spring-auth"
            "dino-spring-core"
          )
          # 循环遍历项目数组
          for project in "${projects[@]}"; do
            # 进入项目目录
            cd "$project"
            # 输出开始打包信息
            echo "=============== 开始打包 $project ==============="
            # 执行mvn命令
            mvn clean install $MVN_OPT $BUILD_OPT -Dgpg.skip=true
            # 返回到上一级目录
            cd ..
          done

          echo "所有项目打包完成。"

      - name: Publish to Maven Central
        run: |
          echo "是否自动发布：$AUTO_PUBLISH"
          echo "等待条件：$WAIT_UNTIL"
          # 定义发布参数
          if [ "$AUTO_PUBLISH" = false ]; then
            export DEPLOY_AUTO_PUBLISH=false
            export DEPLOY_WAIT_UNTIL=${WAIT_UNTIL:-"uploaded"}
          else
            export DEPLOY_AUTO_PUBLISH=true
            export DEPLOY_WAIT_UNTIL=${WAIT_UNTIL:-"published"}
          fi

          # 从用户输入中获取skip_projects变量
          skip_projects=()
          if [ "${{ github.event.inputs.dino_dependencies_root }}" = true ]; then
            skip_projects+=("dino-dependencies-root")
          fi
          if [ "${{ github.event.inputs.dino_spring_assembly }}" = true ]; then
            skip_projects+=("dino-spring-assembly")
          fi
          if [ "${{ github.event.inputs.dino_spring_boot_starter_parent }}" = true ]; then
            skip_projects+=("dino-spring-boot-starter-parent")
          fi
          if [ "${{ github.event.inputs.dino_spring_cloud_starter_parent }}" = true ]; then
            skip_projects+=("dino-spring-cloud-starter-parent")
          fi
          if [ "${{ github.event.inputs.dino_spring_commons }}" = true ]; then
            skip_projects+=("dino-spring-commons")
          fi
          if [ "${{ github.event.inputs.dino_spring_data }}" = true ]; then
            skip_projects+=("dino-spring-data")
          fi
          if [ "${{ github.event.inputs.dino_spring_auth }}" = true ]; then
            skip_projects+=("dino-spring-auth")
          fi

          echo "=============== 开始发布到Maven中央仓库 ==============="
          # 定义项目数组
          projects=(
            "dino-dependencies-root"
            "dino-spring-assembly"
            "dino-spring-boot-starter-parent"
            "dino-spring-cloud-starter-parent"
            "dino-spring-commons"
            "dino-spring-data"
            "dino-spring-auth"
            "dino-spring-core"
          )
          # 循环遍历项目数组
          for project in "${projects[@]}"; do
            # 如果用户选择跳过当前项目，则跳过当前项目
            if [[ " ${skip_projects[@]} " =~ " $project " ]]; then
              echo "=============== 跳过发布 $project ==============="
              continue
            fi
            # 进入项目目录
            cd "$project"
            # 输出开始发布信息
            echo "=============== 开始发布 $project ==============="
            # 执行mvn命令
            mvn deploy $MVN_OPT $BUILD_OPT \
              -Dcentral.autoPublish="$DEPLOY_AUTO_PUBLISH" \
              -Dcentral.waitUntil="$DEPLOY_WAIT_UNTIL"
            # 返回到上一级目录
            cd ..
          done

          echo "所有项目发布完成。"
